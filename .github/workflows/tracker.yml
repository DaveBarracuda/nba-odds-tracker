name: NBA odds tracker

on:
  schedule:
    - cron: "5,35 * * * *"   # cada 30 min; el código decide si toca snapshot de pago (60 o 30 min)
  workflow_dispatch:

concurrency:
  group: nba-odds-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout de la rama data (base SQLite, logs, dashboard)
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot y alertas
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOKMAKERS: ${{ vars.BOOKMAKERS || 'draftkings' }}
          MARKETS: ${{ vars.MARKETS || 'h2h,spreads,totals' }}
          MIN_CREDITS_REMAINING: ${{ vars.MIN_CREDITS_REMAINING || '20' }}
          TZ: America/Mexico_City
        run: python -m tracker run

      - name: Guardar datos en la rama data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          # un solo commit reescrito: la base SQLite guarda la historia, el repo no crece
          git commit --amend -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:data
