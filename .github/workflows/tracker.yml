name: NBA odds tracker

# Un snapshot por corrida, disparado por cron cada 30 min. SIN loop y SIN relanzamiento:
# cada job dura 1-2 minutos en vez de 5.5 h.
#
# El patrón anterior —un job de 5.5 h que dormía entre snapshots y al terminar se relanzaba a
# sí mismo con workflow_dispatch— ocupaba un runner las 24 h del día de forma perpetua. Eso es
# consumo excesivo de Actions: el repo gemelo de NFL quedó bloqueado por ToS el 2026-11-24.
#
# `python -m tracker run` ya decide si toca snapshot de pago (tracker/schedule.py), así que una
# corrida que no toca solo usa el endpoint de eventos, que es gratis. Si GitHub retrasa los
# disparos, el tracker avisa por Telegram cuando un hueco pasa de 2.5 h: la cadencia se
# degrada, no se rompe.
#
# Para detenerlo: gh workflow disable tracker.yml
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: nba-odds-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Checkout de la rama data (base SQLite, logs, dashboard)
        uses: actions/checkout@v5
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOKMAKERS: ${{ vars.BOOKMAKERS }}          # vacío = las 10 casas por defecto (config.py)
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}  # vacío = 30 días
          MARKETS: ${{ vars.MARKETS || 'h2h,spreads,totals' }}
          MIN_CREDITS_REMAINING: ${{ vars.MIN_CREDITS_REMAINING || '20' }}
          TZ: America/Mexico_City
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python -m tracker run || echo "::warning::la corrida falló"

          [ -f data/index.html ] || printf '<meta http-equiv="refresh" content="0; url=dashboard.html">\n' > data/index.html
          git -C data add -A
          if git -C data diff --cached --quiet; then
            echo "sin cambios en data"
            exit 0
          fi
          # un solo commit reescrito: la base SQLite guarda la historia, el repo no crece
          git -C data commit -q --amend -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git -C data push -q --force origin HEAD:data || echo "::warning::push a data falló"
