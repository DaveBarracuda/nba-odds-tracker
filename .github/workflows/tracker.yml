name: NBA odds tracker

# El cron de GitHub se retrasa horas en repos poco activos, así que el job corre en loop
# ~5.5 h (snapshot cuando toca, en los minutos :00 y :30) y al terminar se relanza a sí mismo
# con workflow_dispatch. El cron cada 3 h solo es un respaldo por si la cadena se corta.
# Para detenerlo: gh workflow disable tracker.yml
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"   # respaldo; los disparos programados quedan en espera mientras corre el loop

concurrency:
  group: nba-odds-tracker
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  LOOP_SECONDS: "19800"   # 5.5 h; el límite de un job es 6 h

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - name: Checkout de la rama data (base SQLite, logs, dashboard)
        uses: actions/checkout@v5
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Loop de snapshots
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOKMAKERS: ${{ vars.BOOKMAKERS || 'draftkings' }}
          MARKETS: ${{ vars.MARKETS || 'h2h,spreads,totals' }}
          MIN_CREDITS_REMAINING: ${{ vars.MIN_CREDITS_REMAINING || '20' }}
          TZ: America/Mexico_City
        run: |
          git -C data config user.name "github-actions[bot]"
          git -C data config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          save_data() {
            [ -f data/index.html ] || printf '<meta http-equiv="refresh" content="0; url=dashboard.html">\n' > data/index.html
            git -C data add -A
            if git -C data diff --cached --quiet; then return 0; fi
            # un solo commit reescrito: la base SQLite guarda la historia, el repo no crece
            git -C data commit -q --amend -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git -C data push -q --force origin HEAD:data || echo "::warning::push a data falló"
          }
          end=$((SECONDS + LOOP_SECONDS))
          while [ "$SECONDS" -lt "$end" ]; do
            python -m tracker run || echo "::warning::la corrida falló"
            save_data
            now=$(date +%s)
            wait=$(( (now / 1800 + 1) * 1800 - now + 5 ))   # siguiente :00 o :30
            left=$(( end - SECONDS ))
            [ "$wait" -ge "$left" ] && break
            sleep "$wait"
          done

      - name: Relanzar la cadena
        if: always()   # también tras una cancelación del runner; para detener: gh workflow disable
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tracker.yml --ref "${{ github.ref_name }}" -R "${{ github.repository }}"
